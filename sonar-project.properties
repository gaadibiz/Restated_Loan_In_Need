# SonarQube Project Configuration
# Configure your SonarQube server URL (uncomment and set)
# sonar.host.url=http://localhost:9000

# SonarCloud configuration (required for SonarCloud)
# IMPORTANT: Replace 'YOUR_ORG_KEY' with your actual SonarCloud organization key
# Find your organization key at: https://sonarcloud.io/account/organizations
sonar.organization=aerotalk
sonar.host.url=https://sonarcloud.io

# Project identification
sonar.projectKey=loaninneed
sonar.projectName=LoanInNeed
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=Backend,lin-frontend
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/generated/**,**/uploads/**,**/logs/**,**/*.min.js,**/*.min.css,**/jest-html-reporters-attach/**,**/reports/**,**/*.pdf,**/public/**,**/*.config.js,**/*.config.mjs

# Test files (only Backend has tests)
sonar.tests=Backend/__tests__
sonar.test.inclusions=**/*.spec.js,**/*.test.js,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx

# Language and encoding
sonar.language=js,ts
sonar.sourceEncoding=UTF-8

# Coverage reports (if available)
# Uncomment when you have coverage reports
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions for coverage
sonar.coverage.exclusions=**/*.spec.js,**/*.test.js,**/*.spec.ts,**/*.test.ts,**/__tests__/**,**/node_modules/**,**/generated/**,**/dist/**,**/build/**,**/.next/**,**/config/**,**/migrations/**

# JavaScript/TypeScript specific settings
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Duplications
sonar.cpd.exclusions=**/*.spec.js,**/*.test.js,**/*.spec.ts,**/*.test.ts,**/node_modules/**,**/generated/**,**/public/**

# Code analysis mode
# Options: publish, preview, issues
sonar.analysis.mode=publish

# Additional exclusions
sonar.exclusion.patterns=**/node_modules/**,**/generated/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/uploads/**,**/logs/**

